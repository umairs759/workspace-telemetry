name: Endpoint Pulse

on:
  schedule:
    # Rozana raat 12:00 UTC pr chalega (PKT k mutabiq subah 5:00 AM)
    - cron: '0 0 * * *'
  workflow_dispatch: # Manual test button

permissions:
  contents: write

jobs:
  telemetry-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Telemetry State
        run: |
          mkdir -p telemetry
          echo "{\"status\": \"healthy\", \"last_sync\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\", \"node\": \"endpoint-pulse-01\"}" > telemetry/heartbeat.json

      - name: Commit and Push
        run: |
          git config --global user.name "umairs759"
          git config --global user.email "umairghaffar759@gmail.com"
          git add telemetry/heartbeat.json
          git commit -m "telemetry: sync daily heartbeat state" || exit 0
          git pull --rebase origin main
          git push
